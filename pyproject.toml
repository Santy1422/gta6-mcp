[project]
name = "gta6-mcp"
version = "0.1.0"
description = "Claude plays GTA 6 on a stock PS5 via Remote Play — an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyremoteplay>=0.7.6",
    # pyremoteplay is unmaintained; these pins keep it importable on modern Python
    "pyee==9.0.4",
    "async-timeout>=4.0",
    "av>=10.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
gta6-mcp = "gta6_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E402"]  # session.py filters warnings before importing pyremoteplay

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["gta6_mcp", "countdown"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
